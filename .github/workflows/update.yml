name: 更新过滤规则

# 每天北京时间 08:00 / 20:00 各更新一次 (= UTC 00:00 / 12:00)
on:
  schedule:
    # 每天北京时间 08:00 / 20:00 更新 (UTC 00:00 / 12:00)
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
    # 每 6 小时清一次本工作流历史 (06:00 / 18:00 UTC, 北京时间 14:00 / 02:00)
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      cleanup_only:
        description: "仅清理本工作流历史 (保留最新 3 条)"
        required: false
        default: false
  push:
    branches: [ main ]
    paths:
      - "merge_filters.py"
      - "config.json"
      - "docs/**"
      - "tests/**"
      - "tools/**"
      - "scriptlets/**"
      - "benchmarks/**"
      - "benchmark.py"
      - ".github/workflows/update.yml"

concurrency:
  group: update-rules
  cancel-in-progress: false        # 不取消排队中的更新 — 推送竞态曾是真实故障源

jobs:
  # 2026-10 GitHub 官方将 ubuntu-latest 迁移到 26.04, 先锁定 24.04

  update:
    # 只在"正常更新"触发源下跑: 00/12 定时 / 普通 dispatch / 任意 push。
    # 06/18 定时与 cleanup_only dispatch 是纯清理, 若这里也跑 update, 会同一 run
    # 里 "git push + 部署 + 删历史 run" 互相叠加; 排除它们即消除该冲突。
    if: |
      !(github.event_name == 'schedule' && (github.event.schedule == '0 6 * * *' || github.event.schedule == '0 18 * * *'))
      && !(github.event_name == 'workflow_dispatch' && inputs.cleanup_only == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write           # 提交并推送更新后的产物
    env:
      TZ: Asia/Shanghai            # 作业内所有时间戳走北京时间
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: 运行测试
        run: python -m unittest discover -s tests -v

      # ABP 官方测试订阅: 拉最新版逐条解析。官网新增语法若引擎不支持会阻断发布;
      # 网络不可达时自动回退 tests/data 快照, 不阻断。
      - name: ABP 官方测试订阅语法检查 (阻断)
        run: python tools/abp_testpages_check.py --snapshot tests/data/abp-testcase-subscription.txt

      - name: 下载并合并规则
        run: python merge_filters.py --config config.json --outdir output

      # 扩展建议 2: 规则质量门控 —— 依赖 output/stats.json, 必须在 merge 之后
      # 跑。门限硬约束: 超过即 fail → 阻断推送。
      - name: 规则质量门控 (阻断)
        run: python -m unittest tests.test_quality_gate.TestQualityGate -v

      - name: 离线覆盖率跑分 (非阻断)
        continue-on-error: true
        run: python benchmark.py --out output/benchmark.json

      - name: 提交并推送 (带重试, 防非快进竞态)
        id: publish
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 显式列出产物, 避免把本地调试文件 (截图等) 误提交
          git add output/*.txt output/stats.json output/benchmark.json \
                  output/badge-*.json output/badge-*.svg
          # 只比对"实质内容": 每份产物头部都写 Version / Last Modified 时间戳,
          # badge-updated.* 也带时间 —— 直接 git diff 永远非空, 于是"无变化跳过"
          # 从未生效 (实测 240 次提交里 182 次是这种噪音提交)。
          # -I 忽略时间戳行 + 排除 badge-updated.* 之后, 才等价于"规则真的变了"。
          if git diff --cached --quiet \
               -I 'Version:' -I 'Last Modified:' -- output/ \
               ':(exclude)output/badge-updated.json' \
               ':(exclude)output/badge-updated.svg'; then
            echo "规则无变化, 跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git commit -m "自动更新过滤规则 (北京时间 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M'))"
            # 远端被并发移动时 (另一 run/人工/API 推送) rebase 重试, 最多 3 次
            for i in 1 2 3; do
              if git push; then
                echo "推送成功 (尝试 $i)"; break
              fi
              echo "推送被拒 (尝试 $i), rebase 后重试…"
              git fetch origin main
              git rebase origin/main
              if [ "$i" = "3" ]; then
                echo "::warning::推送 3 次被拒 — 请检查是否有并发推送冲突"
                exit 1
              fi
            done
          fi


      - name: 记录本次提交 SHA (供 Pages 部署使用)
        id: sha
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    outputs:
      commit: ${{ steps.sha.outputs.commit }}
      changed: ${{ steps.publish.outputs.changed }}

  deploy-pages:
    needs: update
    # 定时触发且产物无变化 → 跳过部署 (站点内容未变, 无需重发);
    # push / 手动触发一律部署: push 可能改的是 docs/**, 手动则用于强制重发。
    if: |
      inputs.cleanup_only != 'true'
      && always()
      && needs.update.result == 'success'
      && (github.event_name != 'schedule' || needs.update.outputs.changed == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read            # checkout 产物
      pages: write              # 发布 Pages
      id-token: write           # Pages OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_first.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.update.outputs.commit }}
      - name: 组装站点 (订阅中心 + 全部订阅文件)
        run: |
          mkdir -p site
          cp docs/index.html docs/logo.svg site/
          cp output/*.txt output/stats.json output/badge-*.json output/badge-*.svg site/
          cp output/benchmark.json site/ || true
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
      # GitHub 的 artifact 元数据偶发延迟: upload 刚结束就查询会得到
      # "Found 0 artifact(s)" (实测 4 次失败均发生在 upload 与 deploy
      # 同一秒内)。首次部署失败时等待片刻重试一次, 避免整条流水线变红。
      - id: deployment_first
        uses: actions/deploy-pages@v5.0.1
        continue-on-error: true
      - name: 等待 artifact 元数据可见
        if: steps.deployment_first.outcome == 'failure'
        run: sleep 15
      - id: deployment
        if: steps.deployment_first.outcome == 'failure'
        uses: actions/deploy-pages@v5.0.1

  # 定时清理本工作流历史: 保留最新 3 条, 删除更早的 (防 run 列表无限膨胀)
  cleanup-actions:
    # 仅在: 定时 06:00/18:00 UTC + 手动勾选 cleanup_only
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *')
      || (github.event_name == 'schedule' && github.event.schedule == '0 18 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.cleanup_only == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write            # 删除本工作流的历史 run
    concurrency:
      group: cleanup-actions
      cancel-in-progress: false
    steps:
      - name: 删除旧 run (保留最新 3 条)
        run: |
          set -u
          TOKEN="${{ github.token }}"
          REPO="${{ github.repository }}"
          KEEP=3
          page=1
          total=0
          # 分页收集本工作流 run (每行 "<id>\t<status>", API 默认最新在前 = 保留顺序)
          while :; do
            resp=$(curl -sS -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/repos/$REPO/actions/workflows/update.yml/runs?per_page=100&page=$page")
            rows=$(printf '%s' "$resp" | jq -r '.workflow_runs[] | "\(.id)\t\(.status)"')
            cnt=$(printf '%s\n' "$rows" | grep -c . || true)
            total=$((total+cnt))
            printf '%s\n' "$rows" >> /tmp/runs.tsv || true
            [ "$cnt" -lt 100 ] && break
            page=$((page+1))
          done
          echo "共读到 $total 条历史 run, 保留最新 $KEEP 条"
          [ -f /tmp/runs.tsv ] || exit 0
          # 前 KEEP 行(最新)一律保留; 其余仅删"已完成"的, 不碰 in_progress/queued,
          # 也不删自身 (自身可能仍是 in_progress/queued, 已被 KEEP 覆盖)
          deleted=0 skipped=0
          lineno=0
          while IFS=$'\t' read -r id status; do
            lineno=$((lineno+1))
            [ -z "$id" ] && continue
            [ "$lineno" -le "$KEEP" ] && continue
            [ "$id" = "${{ github.run_id }}" ] && { echo "跳过自身 $id"; continue; }
            case "$status" in
              completed)
                code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
                       -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
                       "https://api.github.com/repos/$REPO/actions/runs/$id")
                if [ "$code" = "200" ] || [ "$code" = "204" ]; then
                  deleted=$((deleted+1))
                else
                  echo "  run $id 删除失败 (HTTP $code)"
                fi
                ;;
              *)
                # 在途/排队 — 跳过, 等它结束下轮再清
                skipped=$((skipped+1))
                ;;
            esac
            sleep 0.3
          done < /tmp/runs.tsv
          echo "本次删除 $deleted 条已完成 run, 跳过 $skipped 条在途/排队, 保留最新 $KEEP 条"
