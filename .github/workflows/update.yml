name: 更新过滤规则

# 每天北京时间 08:00 / 20:00 各更新一次 (= UTC 00:00 / 12:00)
on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "merge_filters.py"
      - "config.json"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-rules
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai          # 作业内所有时间戳走北京时间
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行测试
        run: python -m unittest discover -s tests -v

      - name: 下载并合并规则
        run: python merge_filters.py --config config.json --outdir output

      - name: 提交并推送
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "规则无变化, 跳过提交"
          else
            git commit -m "自动更新过滤规则 (北京时间 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M'))"
            git push
          fi
