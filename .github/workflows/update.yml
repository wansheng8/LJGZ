name: 更新过滤规则

# 每天北京时间 08:00 / 20:00 各更新一次 (= UTC 00:00 / 12:00)
on:
  schedule:
    # 每天北京时间 08:00 / 20:00 更新 (UTC 00:00 / 12:00)
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
    # 每 6 小时清一次 Actions 历史 (06:00 / 18:00 UTC, 北京时间 14:00 / 02:00)
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      cleanup_only:
        description: "仅清理 Actions 历史 (保留最新 3 条)"
        required: false
        default: false
  push:
    branches: [ main ]
    paths:
      - "merge_filters.py"
      - "config.json"
      - "docs/**"
      - "tests/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write
  # 删除历史 Actions run 需要
  actions: write

concurrency:
  group: update-rules
  cancel-in-progress: false        # 不取消排队中的更新 — 推送竞态曾是真实故障源

jobs:
  # 2026-10 GitHub 官方将 ubuntu-latest 迁移到 26.04, 先锁定 24.04

  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai            # 作业内所有时间戳走北京时间
    steps:
      - uses: actions/checkout@v4.4.0

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: 运行测试
        run: python -m unittest discover -s tests -v

      - name: 下载并合并规则
        run: python merge_filters.py --config config.json --outdir output

      - name: 提交并推送 (带重试, 防非快进竞态)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "规则无变化, 跳过提交"
            echo "changed=false" >> "$GITHUB_STATE" || true
          else
            git commit -m "自动更新过滤规则 (北京时间 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M'))"
            # 远端被并发移动时 (另一 run/人工/API 推送) rebase 重试, 最多 3 次
            for i in 1 2 3; do
              if git push; then
                echo "推送成功 (尝试 $i)"; break
              fi
              echo "推送被拒 (尝试 $i), rebase 后重试…"
              git fetch origin main
              git rebase origin/main
              if [ "$i" = "3" ]; then
                echo "::warning::推送 3 次被拒 — 请检查是否有并发推送冲突"
                exit 1
              fi
            done
          fi


      - name: 记录本次提交 SHA (供 Pages 部署使用)
        id: sha
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    outputs:
      commit: ${{ steps.sha.outputs.commit }}

  deploy-pages:
    needs: update
    if: |
      !inputs.cleanup_only
      && always()
      && needs.update.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: ${{ needs.update.outputs.commit }}
      - name: 组装站点 (订阅中心 + 全部订阅文件)
        run: |
          mkdir -p site
          cp docs/index.html docs/logo.svg site/
          cp output/*.txt output/stats.json output/badge-*.json output/badge-*.svg site/
      - uses: actions/configure-pages@v5.0.0
      - uses: actions/upload-pages-artifact@v3.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4.0.0

  # 定时清理 Actions 历史: 保留最新 3 条, 删除更早的 (防 run 列表无限膨胀)
  cleanup-actions:
    # 仅在: 定时 06:00/18:00 UTC + 手动勾选 cleanup_only
    if: |
      (github.event_name == 'schedule' && github.event.cron == '0 6 * * *')
      || (github.event_name == 'schedule' && github.event.cron == '0 18 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.cleanup_only == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: cleanup-actions
      cancel-in-progress: false
    steps:
      - name: 删除旧 run (保留最新 3 条)
        run: |
          set -u
          TOKEN="${{ github.token }}"
          REPO="${{ github.repository }}"
          KEEP=3
          page=1
          total=0
          # 分页收集所有 run id (API 默认最新在前)
          while :; do
            resp=$(curl -sS -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/repos/$REPO/actions/runs?per_page=100&page=$page")
            batch=$(printf '%s' "$resp" | grep -o '"id": *[0-9]*' | cut -d' ' -f2)
            cnt=$(printf '%s\n' $batch | grep -c . || true)
            total=$((total+cnt))
            printf '%s\n' $batch >> /tmp/run_ids.txt || true
            [ "$cnt" -lt 100 ] && break
            page=$((page+1))
          done
          echo "共读到 $total 条历史 run, 保留最新 $KEEP 条"
          if [ ! -f /tmp/run_ids.txt ]; then exit 0; fi
          # API 默认最新在前: 保留前 KEEP 条, 删其余
          to_delete=$(tail -n +$((KEEP+1)) /tmp/run_ids.txt || true)
          n=$(printf '%s\n' $to_delete | grep -c . || echo 0)
          echo "待删 $n 条"
          deleted=0
          while IFS= read -r id; do
            [ -z "$id" ] && continue
            # 不删自己 (DELETE 在途 run 会 409, 这里显式跳过更稳)
            [ "$id" = "${{ github.run_id }}" ] && { echo "跳过自身 $id"; continue; }
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
                   -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/repos/$REPO/actions/runs/$id")
            if [ "$code" = "200" ] || [ "$code" = "204" ]; then
              deleted=$((deleted+1))
            else
              echo "  run $id 删除失败 (HTTP $code)"
            fi
            sleep 0.3
          done <<< "$to_delete"
          echo "本次删除 $deleted 条, 保留最新 $KEEP 条"
