name: 更新过滤规则

# 每天北京时间 08:00 / 20:00 各更新一次 (= UTC 00:00 / 12:00)
on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "merge_filters.py"
      - "config.json"
      - "docs/**"
      - "tests/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-rules
  cancel-in-progress: false        # 不取消排队中的更新 — 推送竞态曾是真实故障源

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai            # 作业内所有时间戳走北京时间
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行测试
        run: python -m unittest discover -s tests -v

      - name: 下载并合并规则
        run: python merge_filters.py --config config.json --outdir output

      - name: 提交并推送 (带重试, 防非快进竞态)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "规则无变化, 跳过提交"
            echo "changed=false" >> "$GITHUB_STATE" || true
          else
            git commit -m "自动更新过滤规则 (北京时间 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M'))"
            # 远端被并发移动时 (另一 run/人工/API 推送) rebase 重试, 最多 3 次
            for i in 1 2 3; do
              if git push; then
                echo "推送成功 (尝试 $i)"; break
              fi
              echo "推送被拒 (尝试 $i), rebase 后重试…"
              git fetch origin main
              git rebase origin/main
              if [ "$i" = "3" ]; then
                echo "::warning::推送 3 次被拒 — 请检查是否有并发推送冲突"
                exit 1
              fi
            done
          fi


      - name: 记录本次提交 SHA (供 Pages 部署使用)
        id: sha
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    outputs:
      commit: ${{ steps.sha.outputs.commit }}

  deploy-pages:
    needs: update
    if: always() && needs.update.result == 'success'   # 即使"无变化跳过"也部署 (保证 Pages 与 main 一致)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 锁定本次更新产生的确切提交 — main 若被后续提交移动, 部署的仍是刚验证过的内容
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.update.outputs.commit }}
      - name: 组装站点 (订阅中心 + 全部订阅文件)
        run: |
          mkdir -p site
          cp docs/index.html docs/logo.svg site/
          cp output/*.txt output/stats.json output/badge-*.json output/badge-*.svg site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
