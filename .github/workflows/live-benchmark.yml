name: Live Benchmark

# 真实浏览器跑分: 非阻断, 失败不影响订阅更新
on:
  schedule:
    - cron: "30 18 * * 0"   # 每周一 02:30 北京
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: 安装 Playwright / Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: 运行真实浏览器跑分
        continue-on-error: true
        run: |
          python tools/live_benchmark.py \
            --screenshot live-benchmark.png \
            --out live-benchmark.json

      - name: 上传跑分结果
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: live-benchmark
          path: |
            live-benchmark.json
            live-benchmark.png
          if-no-files-found: warn
          retention-days: 30
