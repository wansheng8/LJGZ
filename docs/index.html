<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LJGZ · 广告过滤订阅中心</title>
<meta name="description" content="多上游广告过滤规则聚合订阅中心 · 每日北京时间自动更新"/>
<style>
:root{
  --bg:#0b1020; --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.09);
  --txt:#e8ecf8; --dim:#8b93ab; --acc:#6ea8fe; --acc2:#8b5cf6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  background:
    radial-gradient(900px 500px at 15% -10%, rgba(110,168,254,.16), transparent 60%),
    radial-gradient(800px 500px at 90% 0%, rgba(139,92,246,.14), transparent 55%),
    var(--bg);
  color:var(--txt);padding:48px 20px 80px;
}
.wrap{max-width:980px;margin:0 auto}
header{text-align:center;margin-bottom:40px}
header img{width:84px;filter:drop-shadow(0 8px 24px rgba(110,168,254,.45))}
h1{margin-top:14px;font-size:34px;letter-spacing:.5px}
h1 .dot{background:linear-gradient(90deg,var(--acc),var(--acc2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);margin-top:8px;font-size:14.5px}
.badges{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.badges img{height:22px}
.stats{margin-top:20px;display:flex;gap:30px;justify-content:center;flex-wrap:wrap;
  font-size:12.5px;color:var(--dim)}
.stats b{display:block;font-size:21px;color:var(--txt);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:22px 22px 18px;backdrop-filter:blur(6px);
  transition:border-color .2s,transform .2s}
.card:hover{border-color:rgba(110,168,254,.45);transform:translateY(-2px)}
.card h2{font-size:17px;display:flex;align-items:center;gap:10px}
.card h2 .ico{font-size:22px}
.card .apps{color:var(--dim);font-size:12.5px;margin-top:4px}
.url{margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.url .row{display:flex;align-items:center;gap:10px;padding:9px 12px}
.url .row+.row{border-top:1px solid var(--line)}
.tag{flex:none;font-size:11px;color:#0b1020;border-radius:999px;padding:2px 9px;
  font-weight:700;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.tag.alt{background:none;color:var(--dim);border:1px solid var(--line)}
.addr{flex:1;min-width:0;font-family:ui-monospace,Consolas,monospace;font-size:12px;
  color:#c3cbf0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{flex:none;cursor:pointer;border:none;border-radius:8px;padding:6px 12px;
  font-size:12px;color:#0b1020;background:rgba(255,255,255,.85);transition:.15s}
button:hover{background:#fff}
button.ok{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff}
.tip{margin-top:10px;color:var(--dim);font-size:12px;line-height:1.8}
footer{margin-top:44px;text-align:center;color:var(--dim);font-size:12.5px;line-height:2}
footer a{color:var(--acc);text-decoration:none}
@media(max-width:520px){.grid{grid-template-columns:1fr}h1{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <img src="logo.svg" alt="LJGZ"/>
  <h1>LJGZ<span class="dot"> · 广告过滤订阅中心</span></h1>
  <p class="sub">EasyList 系 · uBO 官方 · AdGuard 官方 · Fanboy · OISD · hagezi · anti-AD · CJX ·
    URLhaus · Blackbook 等 20+ 大上游 · 广告/隐私/恶意软件/钓鱼/挖矿全覆盖</p>
  <div class="badges">
    <img src="https://img.shields.io/endpoint?url=https%3A%2F%2Fraw.githubusercontent.com%2Fwansheng8%2FLJGZ%2Fmain%2Foutput%2Fbadge-rules.json" alt="规则总数"/>
    <img src="https://img.shields.io/endpoint?url=https%3A%2F%2Fraw.githubusercontent.com%2Fwansheng8%2FLJGZ%2Fmain%2Foutput%2Fbadge-domains.json" alt="拦截域名"/>
    <img src="https://img.shields.io/endpoint?url=https%3A%2F%2Fraw.githubusercontent.com%2Fwansheng8%2FLJGZ%2Fmain%2Foutput%2Fbadge-updated.json" alt="更新时间"/>
    <img src="https://github.com/wansheng8/LJGZ/actions/workflows/update.yml/badge.svg" alt="工作流状态"/>
  </div>
  <div class="stats" id="stats" hidden></div>
</header>
<div class="grid" id="grid"></div>
<footer>
  <div>⏰ 每日北京时间 08:00 / 20:00 自动更新 · 全部时间戳为 UTC+8</div>
  <div><a href="https://github.com/wansheng8/LJGZ">GitHub 仓库</a>
    · 上游列表版权归原作者 · 许可证见 README 致谢部分</div>
</footer>
</div>
<script>
const CDN  = 'https://cdn.jsdelivr.net/gh/wansheng8/LJGZ@main/output/';
const PAGES= 'https://wansheng8.github.io/LJGZ/';
const RAW  = 'https://raw.githubusercontent.com/wansheng8/LJGZ/main/output/';
const P = [
 {i:'🧩', n:'浏览器扩展', a:'uBlock Origin · AdGuard · Adblock Plus', f:'all.txt',
  d:'网络规则 + 元素隐藏 + 脚本注入 + 例外，全格式订阅。',
  u:[['完整版', PAGES+'all.txt'], ['备用', RAW+'all.txt']],
  dynamic:'parts',
  t:'⭐ 国内网络推荐订阅下方自动发现的「CDN 分卷」(全部加上 = 完整版)；完整版 >20MB 无法走 jsDelivr'},
 {i:'🏠', n:'AdGuard Home', a:'AdGuard Home · AdGuard DNS · 私人 DNS', f:'adguard.txt',
  d:'子域折叠后的 DNS 拦截规则 + $dnsrewrite 规则 + DNS 白名单。',
  u:[['CDN 推荐', CDN+'adguard.txt'], ['最短', PAGES+'adguard.txt'], ['备用', RAW+'adguard.txt']],
  t:'过滤器 → DNS 拦截 → 添加过滤器，粘贴任一地址即可'},
 {i:'🕳', n:'Pi-hole / hosts', a:'Pi-hole · SwitchHosts · 路由器 / NAS', f:'hosts.txt',
  d:'0.0.0.0 域名 格式，精确匹配语义，含子域条目。',
  u:[['CDN 推荐', CDN+'hosts.txt'], ['最短', PAGES+'hosts.txt'], ['备用', RAW+'hosts.txt']],
  t:'Pi-hole 以 hosts 方式导入；路由器 / NAS 可直接作为 hosts 源'},
 {i:'📃', n:'纯域名列表', a:'Cloudflare Gateway · NextDNS · 各类固件', f:'domains.txt',
  d:'一行一域，已排序去重，适用一切纯域名场景。',
  u:[['CDN 推荐', CDN+'domains.txt'], ['最短', PAGES+'domains.txt'], ['备用', RAW+'domains.txt']],
  t:'直接粘贴或导入任意支持纯域名列表的工具'},
 {i:'✅', n:'DNS 白名单', a:'误拦截放行 · 例外列表', f:'whitelist.txt',
  d:'@@ 例外规则，与拦截列表配合订阅可解除误拦截。',
  u:[['CDN 推荐', CDN+'whitelist.txt'], ['最短', PAGES+'whitelist.txt'], ['备用', RAW+'whitelist.txt']],
  t:'在 AdGuard Home 中作为第二个过滤器订阅（类型：精确/例外）'},
];
const grid = document.getElementById('grid');
for (const p of P) {
  const c = document.createElement('div'); c.className = 'card';
  let rows = '';
  p.u.forEach((u, ix) => {
    rows += `<div class="row"><span class="tag${ix ? ' alt' : ''}">${u[0]}</span>` +
            `<span class="addr">${u[1]}</span>` +
            `<button data-u="${u[1]}">复制</button></div>`;
  });
  c.innerHTML = `<h2><span class="ico">${p.i}</span>${p.n}</h2>` +
    `<div class="apps">${p.a}</div>` +
    `<div class="url" ${p.dynamic ? 'data-dynamic="'+p.dynamic+'"' : ''}>${rows}</div>` +
    `<div class="tip">${p.d}<br>📌 ${p.t}</div>`;
  grid.appendChild(c);
}
grid.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.u); }
  catch (_) {
    const t = document.createElement('textarea');
    t.value = b.dataset.u; document.body.appendChild(t);
    t.select(); document.execCommand('copy'); t.remove();
  }
  b.textContent = '✓ 已复制'; b.classList.add('ok');
  setTimeout(() => { b.textContent = '复制'; b.classList.remove('ok'); }, 1400);
});
// 动态发现 CDN 分卷 (HEAD 探测 01..05, 存在即插入链接行)
(function discoverParts() {
  const box = document.querySelector('[data-dynamic="parts"]');
  if (!box) return;
  let found = 0;
  for (let i = 1; i <= 5; i++) {
    const nn = String(i).padStart(2, '0');
    fetch(CDN + 'all-part-' + nn + '.txt', {method: 'HEAD'})
      .then(r => { if (r.ok) {
        found++;
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `<span class="tag">CDN 分卷 ${found}</span>` +
          `<span class="addr">${CDN}all-part-${nn}.txt</span>` +
          `<button data-u="${CDN}all-part-${nn}.txt">复制</button>`;
        box.insertBefore(row, box.firstChild.nextSibling || box.firstChild);
        // 分卷数可能 >2, 提示文案同步
      } })
      .catch(() => {});
  }
})();

fetch('stats.json').then(r => r.json()).then(s => {
  const el = document.getElementById('stats'); el.hidden = false;
  const f = n => n >= 10000 ? (n / 10000).toFixed(1) + '万' : String(n);
  const total = (s.domains_unique || 0) + (s.network_unique || 0) +
                 (s.cosmetic_unique || 0) + (s.exceptions_unique || 0);
  el.innerHTML =
    `<span><b>${f(s.domains_unique)}</b>拦截域名</span>` +
    `<span><b>${f(total)}</b>规则总数</span>` +
    `<span><b>${s.sources_total || '…'}</b>上游源</span>` +
    `<span><b>2 ×/日</b>北京时间更新</span>`;
}).catch(() => {});
</script>
</body>
</html>
